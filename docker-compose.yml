# Zigbee2MQTT：用 USB Zigbee 棒或网络协调器接入各厂商的 Zigbee 设备，状态和控制经 MQTT 收发。
# MQTT 来自 x-wonton.mqtt 能力的提供方（同批的 mosquitto 插件），地址由核心注入，插件不自带 broker。
services:
  init:
    # 上游没有 configuration.yaml 时会在 8080 起 onboarding 服务并挡住正式启动；
    # 只在文件不存在时种下静态配置，运行期会变的值（MQTT 地址、前端令牌、协调器）走环境变量。
    image: ghcr.io/koenkk/zigbee2mqtt:2.14.3@sha256:fb4a6b0f6868ad1cd6a9996479802b2420e599c3463b62bbff8c8cd9a908f43a
    user: "${PUID}:${PGID}"
    entrypoint: ["/bin/sh", "-c", "test -f /app/data/configuration.yaml || cp /seed/configuration.yaml /app/data/configuration.yaml"]
    volumes:
      - ${WONTON_APP_DATA}:/app/data
    configs:
      - source: seed
        target: /seed/configuration.yaml
    network_mode: none
    restart: "no"

  zigbee2mqtt:
    image: ghcr.io/koenkk/zigbee2mqtt:2.14.3@sha256:fb4a6b0f6868ad1cd6a9996479802b2420e599c3463b62bbff8c8cd9a908f43a
    # 上游镜像默认 root；官方 rootless 方案是 user + 串口组，数据目录属主规则正好交给 PUID:PGID。
    user: "${PUID}:${PGID}"
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      TZ: ${TZ}
      # 上游规则：ZIGBEE2MQTT_CONFIG_* 优先于 configuration.yaml（嵌套键按下划线展开）。
      # 上游对空字符串的覆盖不生效，所以不选适配器（空值注入）等于交给上游自动探测。
      ZIGBEE2MQTT_CONFIG_MQTT_SERVER: ${WONTON_X_WONTON_MQTT_URL}
      ZIGBEE2MQTT_CONFIG_FRONTEND_AUTH_TOKEN: ${WONTON_SECRET_FRONTEND_TOKEN}
      ZIGBEE2MQTT_CONFIG_SERIAL_PORT: ${WONTON_SETTING_SERIAL_PORT}
      ZIGBEE2MQTT_CONFIG_SERIAL_ADAPTER: ${WONTON_SETTING_ADAPTER}
    volumes:
      - ${WONTON_APP_DATA}:/app/data
    healthcheck:
      # frontend 在启动链最后起：它应答了，说明 MQTT 已连上、协调器已打开。
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      start_interval: 2s

configs:
  seed:
    file: config/configuration.yaml

x-wonton:
  spec: "0.12"
  id: io.zigbee2mqtt.zigbee2mqtt
  version: 0.1.0
  kind: app
  title: { zh: 智能家居网关（Zigbee2MQTT）, en: Zigbee Home Hub (Zigbee2MQTT) }
  description:
    zh: 像家里的万能遥控器接收器，用一个小棒子把各家的 Zigbee 传感器、开关接进来，不依赖小米、涂鸦的网关。
    en: Connect Zigbee sensors and switches from any brand with a small USB stick, no vendor hub required.
  icon: icon.svg
  notices: [NOTICE]
  settings: settings.schema.json
  author: { name: geraldpeng6, url: https://github.com/geraldpeng6 }
  homepage: https://www.zigbee2mqtt.io
  license: GPL-3.0-only
  tags:
    zh: [智能家居, 智能配件]
    en: [Home, Devices]
  about:
    zh: |
      把一个 Zigbee 小棒（协调器）插到家里服务器上，各种品牌的 Zigbee 传感器、开关、灯就能统一接入，像给家里装了一个万能接收器。设备状态和控制都发到 MQTT，Home Assistant 等工具可以直接用。

      打开网页可以看设备、改名字、控制开关。支持的设备列表见 zigbee2mqtt.io。

      需要先装一个提供 MQTT 的插件（如 mosquitto）；装插件时按提示选协调器设备。用网络协调器（不插棒子）时在插件设置里把协调器地址改成 tcp://地址:端口。
    en: |
      Plug a Zigbee coordinator stick into your home server and connect Zigbee sensors, switches and lights from any brand through one hub. Device state and control flow over MQTT, ready for Home Assistant and other tools.

      Open the web page to see devices, rename them and control them. Supported devices are listed at zigbee2mqtt.io.

      Requires a plugin that provides MQTT (such as mosquitto); pick the coordinator device when prompted during install. For a network coordinator (no stick), set the coordinator address to tcp://host:port in the plugin settings.
  release_notes:
    zh: 首个版本：Zigbee 设备接入，网页管理和 MQTT 转发。
    en: "First release: Zigbee device support with web management and MQTT."
  webui:
    service: zigbee2mqtt
    port: 8080
    sso: none
  # 串口设备授权（devices.serial，target /dev/zigbee）核心尚未支持：权限和授权字段都会被拒。
  # 未声明时插件装得上但协调器连不上（启动即报错退出），不绕道 privileged 或宿主网络换设备访问。
  permissions: []
  secrets:
    frontend_token:
      # 前端 WebSocket 的访问令牌；网关登录之外的第二道门，换密钥走插件详情页。
      generate: { bytes: 32 }
  requires: [x-wonton.mqtt]
  requirements:
    arch: [amd64, arm64]
    memory: 384M
